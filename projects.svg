<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-label="Featured projects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --card:#f5f5f7; --text:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --line:rgba(0,0,0,0.08); }
    @media (prefers-color-scheme: dark) {
      :root { --card:#161617; --text:#f5f5f7; --muted:#a1a1a6; --accent:#2997ff; --line:rgba(255,255,255,0.12); }
    }
    @media (prefers-contrast: more) { :root { --muted: var(--text); --line: var(--text); } }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .card  { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .cat   { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: var(--accent); }
    .title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; fill: var(--text); }
    .body  { font-size: 16px; font-weight: 400; letter-spacing: -0.005em; fill: var(--muted); }
    .stack { font-size: 13px; font-weight: 500; letter-spacing: 0.01em; fill: var(--text); opacity: 0.8; }
    .rule  { stroke: var(--line); stroke-width: 1; }
    .rise  { animation: rise 0.8s cubic-bezier(0.2,0.8,0.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
  </style>
  <g class="rise" style="animation-delay:0.00s">
    <rect class="card" x="0.5" y="0.5" width="379" height="259" rx="28"/>
    <text class="cat" x="32" y="48">SECURITY  ·  ML</text>
    <text class="title" x="32" y="88">SOAR Intelligence</text>
    <text class="body" x="32" y="128">ML triage, anomaly detection and</text>
    <text class="body" x="32" y="152">LLM response across Wazuh,</text>
    <text class="body" x="32" y="176">TheHive, Cortex and MISP.</text>
    <line class="rule" x1="32" x2="348" y1="208" y2="208"/>
    <text class="stack" x="32" y="236">Python  ·  XGBoost  ·  Docker</text>
  </g>
  <g class="rise" style="animation-delay:0.05s">
    <rect class="card" x="410.5" y="0.5" width="379" height="259" rx="28"/>
    <text class="cat" x="442" y="48">AGENTIC AI</text>
    <text class="title" x="442" y="88">AAVA Resume Agents</text>
    <text class="body" x="442" y="128">Multi-agent CrewAI pipeline on</text>
    <text class="body" x="442" y="152">AWS Bedrock that extracts and</text>
    <text class="body" x="442" y="176">standardizes resumes at Ascendion.</text>
    <line class="rule" x1="442" x2="758" y1="208" y2="208"/>
    <text class="stack" x="442" y="236">CrewAI  ·  Bedrock  ·  Claude</text>
  </g>
  <g class="rise" style="animation-delay:0.10s">
    <rect class="card" x="820.5" y="0.5" width="379" height="259" rx="28"/>
    <text class="cat" x="852" y="48">RETRIEVAL  ·  LLMS</text>
    <text class="title" x="852" y="88">Corrective RAG</text>
    <text class="body" x="852" y="128">Grades retrieved context and</text>
    <text class="body" x="852" y="152">corrects it before the model</text>
    <text class="body" x="852" y="176">answers, in real time.</text>
    <line class="rule" x1="852" x2="1168" y1="208" y2="208"/>
    <text class="stack" x="852" y="236">Qdrant  ·  FAISS  ·  HuggingFace</text>
  </g>
  <g class="rise" style="animation-delay:0.15s">
    <rect class="card" x="0.5" y="290.5" width="379" height="259" rx="28"/>
    <text class="cat" x="32" y="338">SECURITY  ·  ML</text>
    <text class="title" x="32" y="378">Hybrid-NIDS</text>
    <text class="body" x="32" y="418">Signature and anomaly detection</text>
    <text class="body" x="32" y="442">combined, with a web console for</text>
    <text class="body" x="32" y="466">live security insight.</text>
    <line class="rule" x1="32" x2="348" y1="498" y2="498"/>
    <text class="stack" x="32" y="526">Python  ·  React  ·  Node.js</text>
  </g>
  <g class="rise" style="animation-delay:0.20s">
    <rect class="card" x="410.5" y="290.5" width="379" height="259" rx="28"/>
    <text class="cat" x="442" y="338">THREAT INTEL</text>
    <text class="title" x="442" y="378">DARK Intelligence</text>
    <text class="body" x="442" y="418">Threat intelligence platform for</text>
    <text class="body" x="442" y="442">investigation, with built-in</text>
    <text class="body" x="442" y="466">learning tools for researchers.</text>
    <line class="rule" x1="442" x2="758" y1="498" y2="498"/>
    <text class="stack" x="442" y="526">Next.js  ·  Node.js</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <rect class="card" x="820.5" y="290.5" width="379" height="259" rx="28"/>
    <text class="cat" x="852" y="338">SAAS</text>
    <text class="title" x="852" y="378">G-DriveX</text>
    <text class="body" x="852" y="418">One dashboard to manage storage</text>
    <text class="body" x="852" y="442">across multiple Google Drive</text>
    <text class="body" x="852" y="466">accounts.</text>
    <line class="rule" x1="852" x2="1168" y1="498" y2="498"/>
    <text class="stack" x="852" y="526">React  ·  PostgreSQL  ·  OAuth 2.0</text>
  </g>
</svg>