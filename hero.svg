<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Pulkit Tiwari</title>
  <desc id="d">I build AI systems that reason, automate, and ship.</desc>
  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --pill: rgba(255,255,255,0.72);
      --line: rgba(0,0,0,0.08);
      --glow: 0.30;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161617;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #2997ff;
        --pill: rgba(255,255,255,0.08);
        --line: rgba(255,255,255,0.14);
        --glow: 0.38;
      }
    }
    @media (prefers-contrast: more) {
      :root { --muted: var(--text); --line: var(--text); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg    { fill: var(--bg); }
    .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; fill: var(--accent); }
    .name  { font-size: 88px; font-weight: 700; letter-spacing: -0.035em; fill: var(--text); }
    .sub   { font-size: 28px; font-weight: 400; letter-spacing: -0.01em; fill: var(--muted); }
    .pill  { fill: var(--pill); stroke: var(--line); stroke-width: 1; }
    .pilltx{ font-size: 15px; font-weight: 500; fill: var(--text); text-anchor: middle; }
    .glow  { opacity: var(--glow); }

    /* Gentle, one-time entrance. Visible by default if animation is unsupported. */
    .rise { animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.15s; }
    .d3 { animation-delay: 0.25s; }
    .d4 { animation-delay: 0.35s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="clip"><rect width="1200" height="400" rx="32"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect class="bg" width="1200" height="400"/>
    <g class="glow" filter="url(#blur)">
      <circle cx="1010" cy="70"  r="190" fill="#0a84ff"/>
      <circle cx="1130" cy="330" r="170" fill="#bf5af2"/>
      <circle cx="840"  cy="390" r="130" fill="#64d2ff"/>
    </g>
  </g>

  <text class="eyebrow rise d1" x="80" y="112">AI / ML  ·  SOFTWARE  ·  SECURITY</text>
  <text class="name rise d2" x="76" y="204">Pulkit Tiwari.</text>
  <text class="sub rise d3" x="80" y="262">I build AI systems that reason, automate, and ship.</text>

  <g class="rise d4">
    <rect class="pill" x="80"  y="306" width="214" height="38" rx="19"/>
    <text class="pilltx" x="187" y="330">UPES  ·  B.Tech CSE ’27</text>
    <rect class="pill" x="306" y="306" width="212" height="38" rx="19"/>
    <text class="pilltx" x="412" y="330">Ex-Intern  ·  Ascendion</text>
    <rect class="pill" x="530" y="306" width="222" height="38" rx="19"/>
    <text class="pilltx" x="641" y="330">Open to SDE &amp; ML roles</text>
  </g>
</svg>
